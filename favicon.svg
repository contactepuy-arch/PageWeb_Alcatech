<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" style="background:#0a0e1a;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c6ff"/>
      <stop offset="100%" style="stop-color:#0072ff"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#0050cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon icon -->
  <g transform="translate(90, 160)">
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31"
             fill="none" stroke="url(#blueGrad)" stroke-width="3" filter="url(#glow)"/>
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21"
             fill="none" stroke="#0072ff" stroke-width="1" opacity="0.4"/>
    <!-- Node dots -->
    <circle cx="-54" cy="0" r="4" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="54" cy="0" r="4" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="27" cy="-46" r="4" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="-27" cy="-46" r="4" fill="#00e5ff" filter="url(#glow)"/>
    <!-- Circuit arms -->
    <line x1="-54" y1="0" x2="-36" y2="0" stroke="#00c6ff" stroke-width="2"/>
    <line x1="36" y1="0" x2="54" y2="0" stroke="#00c6ff" stroke-width="2"/>
    <line x1="27" y1="-46" x2="18" y2="-31" stroke="#00c6ff" stroke-width="2"/>
    <line x1="-27" y1="-46" x2="-18" y2="-31" stroke="#00c6ff" stroke-width="2"/>
    <!-- A letter -->
    <text x="0" y="18" font-family="Arial Black, Arial" font-weight="900" font-size="52"
          fill="url(#iconGrad)" text-anchor="middle" filter="url(#glow)">A</text>
  </g>

  <!-- ALCA -->
  <text x="168" y="186" font-family="Arial Black, Arial" font-weight="900" font-size="80"
        fill="white" letter-spacing="3">ALCA</text>

  <!-- TECH -->
  <text x="418" y="186" font-family="Arial Black, Arial" font-weight="900" font-size="80"
        fill="url(#blueGrad)" letter-spacing="3" filter="url(#glow)">TECH</text>

  <!-- Separator line -->
  <line x1="168" y1="200" x2="638" y2="200" stroke="url(#blueGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="168" y="224" font-family="Arial" font-size="14" fill="#5080bb" letter-spacing="5">
    ENGINEERING · INDUSTRY · AI
  </text>
</svg>
